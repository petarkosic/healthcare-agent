services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in prod}

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    container_name: ha-server
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in prod}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-healthcare_agent}
      API_KEY: ${API_KEY}
      BASE_URL: ${BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemini-3.1-flash-lite}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
    # Loopback only: reachable from this machine (e.g. a host-run Vite dev
    # server, or a host-installed reverse proxy) but never from the network, so
    # outside clients cannot bypass the proxy or forge X-Real-IP.
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ha-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    container_name: ha-client
    depends_on:
      - server
    networks:
      - ha-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ha-nginx
    ports:
      - '8080:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client
    networks:
      - ha-network
    restart: unless-stopped

networks:
  ha-network:
    name: ha-network-prod
